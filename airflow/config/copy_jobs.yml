# =================================================================
# S3 → Redshift Copy Job Configuration
# To add a new brand/dataset, just add an entry under the right source.
# =================================================================

settings:
  bucket: bellosdata-bronze-raw
  iam_role: ${REDSHIFT_IAM_ROLE}
  workgroup: bellosdata
  database: bellosdata_dwh
  region: eu-west-2

sources:

  # == Omnia Commerce (Custom Platform) ==========================
  omnia_commerce:
    schema: rdl_omnia_commerce
    brands:
      velvet_lane:
        datasets: [customers, products, orders, order_items]
      velvet_mens:
        datasets: [customers, products, orders, order_items]

  # == Salesforce Commerce Cloud (TrendPulse) ============================
  salesforce_commerce:
    schema: rdl_salesforce_commerce
    prefix: trend_pulse
    brands:
      trend_pulse:
        datasets: [customers, products, orders, order_items]

  # == Shopify (RebelChic) =========================================
  shopify:
    schema: rdl_shopify
    brands:
      rebel_chic:
        datasets: [customers, products, orders, order_items]

  # == Magento (AtelierLuxe & RivieraMode) =============================
  magento:
    schema: rdl_magento
    brands:
      atelier_luxe:
        datasets: [customers, products, orders, order_items]
      riviera_mode:
        datasets: [customers, products, orders, order_items]

  # == Oracle Commerce (GrandHeritage) ================================
  oracle_commerce:
    schema: rdl_oracle_commerce
    brands:
      grand_heritage:
        datasets: [customers, products, orders, order_items]

  # == Marketing Channels =========================================
  marketing:
    schema: rdl_marketing
    brands:
      velvet_lane:
        datasets: [meta_ads, google_ads, tiktok_ads, ga4_sessions, email_campaigns, influencer_posts]
      velvet_mens:
        datasets: [meta_ads, google_ads, tiktok_ads, ga4_sessions, email_campaigns, influencer_posts]
      trend_pulse:
        datasets: [meta_ads, google_ads, tiktok_ads, ga4_sessions, email_campaigns, influencer_posts]
      rebel_chic:
        datasets: [meta_ads, google_ads, tiktok_ads, ga4_sessions, email_campaigns, influencer_posts]
      atelier_luxe:
        datasets: [meta_ads, google_ads, tiktok_ads, ga4_sessions, email_campaigns, influencer_posts]
      riviera_mode:
        datasets: [meta_ads, google_ads, tiktok_ads, ga4_sessions, email_campaigns, influencer_posts]
      grand_heritage:
        datasets: [meta_ads, google_ads, tiktok_ads, ga4_sessions, email_campaigns, influencer_posts]
